name: Redirect the old GitHub Pages address

# The site now lives at https://yorkshireschoolchecker.co.uk, built and served by Cloudflare
# (see astro/wrangler.jsonc). This keeps jakeyboy1307.github.io/harrogate-primary-distances
# sending people to the same page there, shared search links included.
on:
  push:
    branches: [main]
    paths: ['pages-redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the same redirect page answers for every old address, including ones that don't exist
      - run: |
          mkdir -p _site/plan _site/how-places-work
          for f in index.html 404.html plan/index.html how-places-work/index.html; do cp pages-redirect/index.html "_site/$f"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
